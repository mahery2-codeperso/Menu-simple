<!DOCTYPE html>
<html>
<head>
    <link rel = "stylesheet" href = "styles/index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
</head>
<body>
<header>

</header>
<main>

    <!-- Pour le bouton Menu -->
    <div class="menu-menu menu">
        <button class="menu">Menu</button>
    </div>

    <!-- Pour le menu principal -->
    <div class = "menu-principal menu masque">
        <button class ="btn-p">Jouer</button>
        <button class ="btn-p">Paramètres</button>
        <button class = "btn-p btn-return">Quitter</button>
    </div>

    <!-- Pour le menu paramètre -->
    <div class="menu-parametre menu masque">
        <button class="btn-prm">Affichage</button>
        <button class="btn-prm">Audio</button>
        <button class="btn-prm">Configurations/Touches</button>
        <button class="btn-prm">Langues</button>
        <button class="btn-prm">Crédits</button>
        <button class="btn-prm btn-return">Retour</button>
    </div>

    <!-- Pour l'affichage quand la fonctionnalité est indisponible -->
    <div class = "label menu masque">
        <h1>Indisponible pour le moment</h1>
    </div>

    <!-- Pour l'interface crédits -->
    <div class = "credit menu masque">
        <h1 id = "one">Développeur : Mahery Rakotomalala</h1>
        <button class = "btn-return">Retour</button>
    </div>


</main>




<script src ="js/index.js"></script>
</body>
</html>
